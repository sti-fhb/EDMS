# 本機開發專用 override（docker compose 預設會自動套用本檔）。
# 正式環境不會吃到這份——CD 明確指定 docker-compose.yml + docker-compose.prod.yml。

services:
  edms-nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    image: edms-nginx:local
    # 本機沒有 front-proxy，直接映射 port 供瀏覽器連入。
    # 用 8090 而非 80，避免與同機的 TBMS 本機環境搶 port。
    ports:
      - "8090:80"
    # 覆寫 docker-compose.yml 的 /opt/edms/nginx-logs 掛載（#944；部署主機上的路徑，且帶
    # create_host_path: false，不覆寫則本機 compose up 會失敗）。改用 tmpfs：容器重建即清空，
    # 與掛載前的本機行為相同；不掛 ./nginx/logs —— 該目錄屬 root 或開發者，nginx（uid 101）
    # 寫不進去，且會在 repo 內產生 log 檔。log 仍可由 docker logs 查看（nginx.conf 另寫一份到 stdout）。
    # ⚠️ target 須與 docker-compose.yml 逐字一致（/var/log/nginx）：compose 的 volumes 依 target 合併。
    volumes:
      - type: tmpfs
        target: /var/log/nginx
        tmpfs:
          size: 67108864

  edms-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: edms-backend:local
    env_file: .env.local
    # 本機用 named volume，避免每次 up 都清空上傳的測試檔
    volumes:
      - edms-dm-files:/app/var/dm_files
      - edms-et-videos:/app/var/et_videos

  edms-db:
    # 用 5441 而非 5432，避免與本機既有的 PostgreSQL 及 TBMS 本機環境（5440）衝突
    ports:
      - "5441:5432"
    volumes:
      - edms-db-data:/var/lib/postgresql/data
    env_file: .env.local

volumes:
  edms-db-data:
  edms-dm-files:
  edms-et-videos:
