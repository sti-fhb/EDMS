services:
  edms-nginx:
    # tag 由 VM 側部署腳本以 EDMS_IMAGE_TAG 指定為 commit short SHA（immutable
    # 部署、可回滾）；未指定時退回 latest 僅供臨時操作使用。
    image: asia-east1-docker.pkg.dev/blood-system-dev/edms-image/edms-nginx:${EDMS_IMAGE_TAG:-latest}
    container_name: edms-nginx
    # ⚠️ 刻意不映射 ports：正式環境由 TBMS repo 管理的 front-proxy 佔 80 並依 Host
    #    分流（見 TBMS 的 edge/README.md）。本機開發所需的 port 定義在
    #    docker-compose.override.yml——compose 的 ports 是**合併**不是覆寫，
    #    留在這裡就沒辦法在 prod 那側移除。
    volumes:
      # nginx access／error log（#944）：不掛載時只寫到 docker logs，每次部署換 image 即隨容器清空。
      # nginx 以 uid 101 執行（nginx/Dockerfile 之 USER nginx），主機目錄 owner 須為 101:101。
      # create_host_path: false —— 目錄未備妥時直接啟動失敗，而非讓 Docker 以 root 自動建出
      # nginx 寫不進去的目錄。輪替由主機 logrotate 負責。主機前置見 docs/infra/deployment.md。
      - type: bind
        source: /opt/edms/nginx-logs
        target: /var/log/nginx
        bind:
          create_host_path: false
    depends_on:
      - edms-backend
    networks:
      - edms-net
    restart: unless-stopped

  edms-backend:
    image: asia-east1-docker.pkg.dev/blood-system-dev/edms-image/edms-backend:${EDMS_IMAGE_TAG:-latest}
    container_name: edms-backend
    # ⚠️ 禁止對外映射 ports：後端僅可經 nginx 抵達，否則會繞過 real_ip 而讓
    #    client IP 可被偽造（限流與稽核都依賴它）
    env_file: .env.prod
    depends_on:
      - edms-db
    networks:
      - edms-net
    restart: unless-stopped

  edms-db:
    image: postgres:17
    container_name: edms-db
    env_file: .env.prod
    volumes:
      - /opt/edms/data/postgres:/var/lib/postgresql/data
    networks:
      - edms-net
    restart: unless-stopped

networks:
  edms-net:
    driver: bridge
