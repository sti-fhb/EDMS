# ============================================================
# Access log 格式：**請求行不記 query string**
#
# 為何獨立一檔：`map` 與 `log_format` 只允許在 http context，而 nginx.conf（server 區塊）
# 被掛進 conf.d/default.conf。此檔以 conf.d/00-log-format.conf 載入（http 層，字首 00-
# 確保早於 default.conf），供 default.conf 之 server 層 access_log 引用。
#
# 動機：以 GET query 傳遞的識別碼（帳號、證件號碼、文件編號等）若進 access log，
# 會繞過 DB 端的加密防護；log 的保存期、備份與可讀取角色通常也比資料庫寬鬆。
#
# 取捨：以 $request_uri 去除 `?` 之後的部分，**刻意不使用 $uri** —— $uri 為 nginx 解碼
# 後的值，`%0A` 之類會還原成真實換行而構成 log injection；$request_uri 為原始字串、
# 不解碼，較安全。查詢條件因此不再進 log。
#
# ⚠️ 已知殘留：error_log 仍會記錄完整 request（含 query string），nginx 的 error log
# 格式不可自訂。壓抑之需將 error_log 提到 `crit`，代價是失去後端中斷的可觀測性，故不採。
# 根治之道是讓明文識別碼不進 query string（改以 POST body 傳查詢條件）。
#
# ⛔ 勿據此宣稱「PII 不進 log」：本系統經 Cloudflare Tunnel 對外，**Cloudflare 端的
# 請求日誌會記錄含 query string 的完整 URI**，不受本檔管轄；另有瀏覽器歷史／Referer。
# ============================================================

map $request_uri $edms_uri_no_query {
    ~^(?<path_only>[^?]*)  $path_only;
    default                "-";
}

log_format edms_no_query '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $edms_uri_no_query $server_protocol" '
                         '$status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent"';
