# ============================================================
# /api/ 的共用轉送設定（#806）
#
# 由 nginx.conf 的三類 API location 共同 include：上傳端點（經 api-upload.conf）、送檔端點
# （另設 `proxy_max_temp_file_size 0`，#810）、一般 API。
# 為何抽出來：各寫一份時，日後只改一處（例如加一個 proxy_set_header 或調限流）
# 不會有任何錯誤訊息，只會讓幾類 API 靜默地走不同規則。
#
# ⚠️ 此檔放 /etc/nginx/，**不可放 conf.d/**：conf.d/*.conf 會被 http 層自動載入，
#    而這裡的指令只能出現在 location 內。
# ============================================================

# 全部 API 每 IP 同時 20 個（#803，理由見 rate-limit.conf 的 `api_conn`）
limit_conn api_conn 20;
limit_req zone=api_limit burst=100 nodelay;

proxy_pass http://edms-backend:8000;
# 固定 Host 為後端服務名，不轉發可竄改的 Host 標頭
proxy_set_header Host edms-backend;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# 上游走 HTTP/1.1（#806）。nginx 預設對上游用 HTTP/1.0，而 1.0 不支援 chunked——客戶端以
# chunked 送 body 時 nginx 會整份暫存才轉，上傳端點的 `proxy_request_buffering off` 因此
# 失效，未登入者可把 501MB 寫進 nginx 的 client_temp。uvicorn 支援 chunked request。
# （未設上游 keepalive，nginx 照預設送 `Connection: close`，每個請求一條上游連線，與改前相同。）
proxy_http_version 1.1;

# ⛔ **不要在這裡**加 `proxy_max_temp_file_size 0`——它只設在 nginx.conf 的下載 location（#810）。
# 設 0 之後 nginx 依客戶端讀取速度向後端取資料；而後端的 DB 交易要等 response **整個送完**才
# commit（FastAPI 的 dependency 在送完後才收尾，見 core/db.py `get_db`）。下載端點已在送檔前
# 以 `release_db_before_streaming` 歸還連線，一般 API 沒有——套在這裡，讀得慢的客戶端取大一點的
# JSON／CSV 就會全程佔住 1 條 DB 連線（連線池只有 15 條）。#806 曾在這裡加過、review 後拿掉。

# ⚠️ 300s 是為大檔上傳設的，但**刻意不對一般 API 縮短**（#806）：Starlette 不會因 nginx
# 斷線而取消 handler，nginx 逾時回 504 之後後端仍把請求跑完、DB 連線照樣佔著——縮短它
# 保護不了 DB 連線池，反而提早釋放 `api_conn` 名額、讓後端並行數更高，並把正常但慢的
# 操作（匯出、對大量學員發布）變成錯誤。真正的保護是後端的查詢逾時（statement_timeout）。
proxy_read_timeout 300s;
proxy_send_timeout 300s;
