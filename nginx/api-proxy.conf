# ============================================================
# /api/ 的共用轉送設定（#806）
#
# 由 nginx.conf 的兩個 API location（上傳端點、一般 API）共同 include。
# 為何抽出來：兩邊各寫一份時，日後只改一邊（例如加一個 proxy_set_header 或調限流）
# 不會有任何錯誤訊息，只會讓上傳與一般 API 靜默地走不同規則。
#
# ⚠️ 此檔放 /etc/nginx/，**不可放 conf.d/**：conf.d/*.conf 會被 http 層自動載入，
#    而這裡的指令只能出現在 location 內。
# ============================================================

# 全部 API 每 IP 同時 20 個（#803，理由見 rate-limit.conf 的 `api_conn`）
limit_conn api_conn 20;
limit_req zone=api_limit burst=100 nodelay;

proxy_pass http://edms-backend:8000;
# 固定 Host 為後端服務名，不轉發可竄改的 Host 標頭
proxy_set_header Host edms-backend;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# 後端回應不寫 nginx 暫存檔（#806）。預設開啟 proxy_buffering 時，客戶端讀得慢，nginx 會把
# 回應寫進 /var/cache/nginx/proxy_temp，每個請求最多 1024m——同一來源開多條慢速的影片串流
# 或文件下載就能寫滿容器磁碟。設 0 後改為依客戶端讀取速度由後端送出（Range 照常可用）；
# 代價是後端連線隨慢客戶端掛著，而後端是 async 的 FileResponse，這個代價小於磁碟被寫滿。
proxy_max_temp_file_size 0;

# ⚠️ 300s 是為大檔上傳設的，但**刻意不對一般 API 縮短**（#806）：nginx 逾時回 504 之後，
# 後端仍會把該請求跑完、DB 連線照樣佔著——縮短它保護不了 DB 連線池，只會把正常但慢的
# 操作（匯出、對大量學員發布）變成錯誤。要保護連線池應在後端設查詢逾時。
proxy_read_timeout 300s;
proxy_send_timeout 300s;
