# ============================================================
# 安全性 response headers（全站套用）
#
# ⚠️ nginx add_header 繼承規則：location 內只要出現任何一個 add_header，
# server 層的 add_header 就全部失效。因此新增的 location 若自帶 add_header
# （如靜態資源的 Cache-Control），必須在該 location 內重新 include 本檔。
#
# `always`：連 4xx / 5xx 錯誤回應也帶上 headers。
# ============================================================

# HSTS 六個月：全站經 Cloudflare 以 HTTPS 對外，瀏覽器記住只走 HTTPS
add_header Strict-Transport-Security "max-age=15552000" always;

# 禁止被任何頁面 iframe 嵌入（防 clickjacking；與 CSP frame-ancestors 互補，
# 涵蓋不支援 CSP 的舊瀏覽器）
add_header X-Frame-Options "DENY" always;

# 禁止瀏覽器猜測 MIME type（防 content sniffing 攻擊）。
# 本行是全站 nosniff 的唯一來源，涵蓋文件下載（attachment）回應在內；
# app 端不應再自行設定此 header，會疊出兩個同名 header。
add_header X-Content-Type-Options "nosniff" always;

# 跨站連結只送 origin，同站送完整 URL
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# 本系統用不到的高風險瀏覽器能力一律關閉
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# CSP：前端 bundle 無任何外部資源，故除以下例外全部鎖 'self'：
#   - style-src 'unsafe-inline'：MUI / Emotion 以行內 <style> 注入樣式，必要
#   - img-src data: blob:：favicon/svg 與檔案下載預覽
#   - media-src 'self' blob:：ET 教育訓練的影音教材播放
#   - font-src data:：字型內嵌
#
# ⚠️ 與 TBMS 的差異：**不放行 http://localhost:9200**。那是 TBMS 的本機標籤列印
# 服務（LB01），EDMS 用不到，放行等於無謂擴大連線來源。
#
# 前端若日後引入外部資源（CDN、外部 API），須同步修改本行，否則會被瀏覽器擋下。
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
