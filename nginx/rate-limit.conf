# ============================================================
# 每 IP 請求限流
#
# 為何獨立一檔：`limit_req_zone` 只允許在 http context，而 nginx.conf（server 區塊）
# 被掛進 conf.d/default.conf。此檔以 conf.d/00-rate-limit.conf 載入（http 層，
# 字首 00- 確保早於 default.conf），供 default.conf 之 location 層 limit_req 引用。
#
# ⚠️ key 為 $binary_remote_addr —— 這**依賴 real_ip 模組已在連線階段還原真實 client
# IP**（見 nginx.conf 的 set_real_ip_from）。若該設定的網段與實際上游不符，所有請求
# 會被算成同一個來源而共用整個額度，尖峰時無差別回 503。該情況下服務不會掛、
# 網站照開，只有 log 與限流靜默失準——上線後必須實地確認 access log 的第一欄
# 是真實外部 IP。
#
# ⚠️ 被擋時回 **503** 而非 429：`limit_req_status`／`limit_conn_status` 未設定，取
# nginx 預設值 503（#803 以前本註解寫成 429，是錯的）。回應是 nginx 的 HTML 錯誤頁，
# 前端 `toApiError` 會顯示「伺服器處理失敗（HTTP 503）」。
# ============================================================

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;

# 文件／教材上傳為長時且大量傳輸，per-IP 併發上限避免單一來源占滿連線與磁碟暫存。
#
# 🔴 **只計入上傳請求**（#803）。#806 起 `limit_conn upload_conn` 只寫在上傳端點的
# location，但那支 regex 同時命中同路徑的 GET（如 `/api/dm/documents` 查清單、
# `.../versions` 查版本），location 分不開，所以鍵仍要依 Content-Type 決定。
# #803 之前以 `$binary_remote_addr` 為鍵、寫在 `location /api/`，等於**每個 IP 同時只能有 4 個 API 請求**——進一次
# ET05 課程編輯頁就同時發 9 個，GCP 實測每次 2～3 個被回 503。多數被查詢的自動重試
# 蓋掉，只有不重試的那支露出來，症狀是「隨機」跳出無關的錯誤提示。
#
# 改以 Content-Type 產生鍵：`multipart/form-data`（上傳檔案）才帶 IP，其餘為空字串，
# 而 nginx 對空鍵**不計數**。⚠️ Content-Type 由用戶端決定，這道只約束**誠實的**上傳；
# 偽造者由下方 `api_conn` 兜底。
map $http_content_type $upload_conn_key {
    ~*^multipart/form-data  $binary_remote_addr;
    default                 "";
}
limit_conn_zone $upload_conn_key zone=upload_conn:10m;

# 上傳端點的寫入請求必須是 multipart（#806）：1 ＝ 要擋（回 415），用於 api-upload.conf。
# 由上而下比對：multipart 的 POST／PUT 放行 → 其餘 POST／PUT／PATCH 擋下 → 其他方法（GET 等）放行。
map "$request_method:$http_content_type" $upload_bad_ct {
    ~*^(POST|PUT):multipart/form-data  0;
    ~^(POST|PUT|PATCH):                 1;
    default                             0;
}

# 全部 API 的 per-IP 併發上限（#803，`api-proxy.conf` 設 20）。
#
# 上面那道改成只算上傳後，原本「每 IP 同時 4 個」順帶擋住的三件事會失去上限
# （#803 security review）：未登入者以大 body 撐爆後端記憶體、單一來源以慢查詢佔滿
# DB 連線池（15 條）、慢速下載寫滿 nginx 暫存。`limit_req` 補不了：它限的是每秒
# **開始**幾個，不是**同時**幾個。
#
# #806 處理了大 body 那件（一般 API 降到 2m、DM 上傳 51m、上傳端點只收 multipart）。
# 另外兩件這道上限**擋不住**：客戶端中途斷線時 nginx 釋放名額，但 Starlette 不取消
# handler，慢查詢照樣跑完——每 IP 實際的後端並行數上限是 `limit_req` 的速率，不是 20。
# 根本修法在後端（查詢逾時、送檔前提前 commit），見 #806 的 follow-up。
#
# 20 的取法：單頁載入約 9 個同時請求，20 容得下一人開兩頁；是**同一瞬間處理中的請求數**，
# 不是人數。⚠️ 院內若多人經同一對外 IP（NAT）連入，這 20 個由那群人共用——使用者回報
# 隨機的「伺服器處理失敗（HTTP 503）」時先查這裡。⛔ 不要拿掉這道、也不要降回個位數：
# 前者讓上面三件事沒有上限，後者就是 #803 本身。
limit_conn_zone $binary_remote_addr zone=api_conn:10m;

# 全站同時下載上限（#833 B3，nginx.conf 送檔 location：DM 300、ET 700）。
#
# 鍵是常數（`$server_name`，本站固定為 `_`）＝**全站一個桶**，不是每 IP：影片播放票不綁 IP、可分給多台
# 機器用，每 IP 的 `api_conn` 擋不住。目的是讓下載**最多佔一半連線格位**，頁面與 API 永遠進得來：
# 兩桶合計 1000 條 × 每條 2 格（客戶端、後端各一）＝ 2000 ≤ 4096 的一半（`worker_connections`，
# 見 tune-main-conf.sh）。zone 由所有 worker 共用，1000 條最壞全落在同一個 worker 也成立，與 worker 數無關。
#
# - **DM 與 ET 分兩桶**（security review）：共用一桶時，影片被塞滿會連帶擋掉 DM 簽核要看的文件
# - 依路徑決定鍵，另一模組的請求鍵為空字串，nginx 對空鍵**不計數**
# - 計的是**同時處理中的請求**，不是人數：播放器的每個 Range 請求各佔一個，拖動進度時新舊請求會短暫並存。
#   ⛔ 不要拿「同時在線人數」直接換算這個值
# - 超過時新的下載回 503（`limit_conn_status` 未設，預設值）
#
# ⛔ 評估後**不設每 IP 的下載上限**：院內多人經同一對外 IP 連入時，同一班學員一起看影片就會互卡；
# 每 IP 已有 `api_conn` 20（送檔 location 也 include api-proxy.conf）。
#
# ⚠️ 前面若還有一層會緩衝回應的反向代理（GCP 的 front-proxy，TBMS repo 管理），慢速讀取的壓力落在那一層，
# 這兩桶不易觸發；直連（院內版）時才完全發揮作用。前層的設定見 #833。
map $uri $download_dm_key {
    ~^/api/dm/  $server_name;
    default     "";
}
map $uri $download_et_key {
    ~^/api/et/  $server_name;
    default     "";
}
limit_conn_zone $download_dm_key zone=download_dm:1m;
limit_conn_zone $download_et_key zone=download_et:1m;
