# ============================================================
# 每 IP 請求限流
#
# 為何獨立一檔：`limit_req_zone` 只允許在 http context，而 nginx.conf（server 區塊）
# 被掛進 conf.d/default.conf。此檔以 conf.d/00-rate-limit.conf 載入（http 層，
# 字首 00- 確保早於 default.conf），供 default.conf 之 location 層 limit_req 引用。
#
# ⚠️ key 為 $binary_remote_addr —— 這**依賴 real_ip 模組已在連線階段還原真實 client
# IP**（見 nginx.conf 的 set_real_ip_from）。若該設定的網段與實際上游不符，所有請求
# 會被算成同一個來源而共用整個額度，尖峰時無差別回 503。該情況下服務不會掛、
# 網站照開，只有 log 與限流靜默失準——上線後必須實地確認 access log 的第一欄
# 是真實外部 IP。
#
# ⚠️ 被擋時回 **503** 而非 429：`limit_req_status`／`limit_conn_status` 未設定，取
# nginx 預設值 503（#803 以前本註解寫成 429，是錯的）。回應是 nginx 的 HTML 錯誤頁，
# 前端 `toApiError` 會顯示「伺服器處理失敗（HTTP 503）」。
# ============================================================

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;

# 文件／教材上傳為長時且大量傳輸，per-IP 併發上限避免單一來源占滿連線與磁碟暫存。
#
# 🔴 **只計入上傳請求**（#803）。`limit_conn` 寫在 `location /api/`，而上傳與一般 API
# 共用路徑（如 `/api/dm/documents` 的 GET 查清單、POST 上傳），無法以 location 分開。
# 原本以 `$binary_remote_addr` 為鍵，等於**每個 IP 同時只能有 4 個 API 請求**——進一次
# ET05 課程編輯頁就同時發 9 個，GCP 實測每次 2～3 個被回 503。多數被查詢的自動重試
# 蓋掉，只有不重試的那支露出來，症狀是「隨機」跳出無關的錯誤提示。
#
# 改以 Content-Type 產生鍵：`multipart/form-data`（上傳檔案）才帶 IP，其餘為空字串，
# 而 nginx 對空鍵**不計數**。⛔ 不要改回以 IP 為鍵、也不要只調高上限——後者只是讓
# 撞上限的頁面變少，頁面請求數一長又會回來。
map $http_content_type $upload_conn_key {
    ~*^multipart/form-data  $binary_remote_addr;
    default                 "";
}
limit_conn_zone $upload_conn_key zone=upload_conn:10m;
