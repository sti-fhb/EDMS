# ============================================================
# 上傳端點的共用設定（#806）
#
# 由 nginx.conf 的兩個上傳 location（DM 文件、ET 影片）共同 include；兩者只差
# `client_max_body_size`。⚠️ 放 /etc/nginx/，不可放 conf.d/（理由同 api-proxy.conf）。
# ============================================================

# 寫入請求必須是 multipart（#806 security review）。後端在驗身分**之前**就解析 body：
# 若改送 `application/x-www-form-urlencoded`，Starlette 會把整份讀進記憶體，而且不計入
# 下方的上傳併發上限（`upload_conn` 只認 multipart）——未登入者每 IP 可同時送 20 個
# 501MB。前端這幾支一律送 `FormData`，正常操作不會碰到 415。
# 判定見 rate-limit.conf 的 `$upload_bad_ct`；GET（文件清單、版本清單）不受影響。
if ($upload_bad_ct) {
    return 415;
}

# 上傳每 IP 同時 4 個（#803，理由見 rate-limit.conf）
limit_conn upload_conn 4;

# 大檔直接串流給後端，不先在 nginx 落地。⚠️ 需搭配 api-proxy.conf 的
# `proxy_http_version 1.1`：上游為 HTTP/1.0 時，chunked 上傳不論本設定都會整份暫存。
proxy_request_buffering off;

include /etc/nginx/api-proxy.conf;
