server {
    listen 80;
    server_name _;

    # Access log 不記 query string（全站套用）。格式定義於 http 層的
    # conf.d/00-log-format.conf，理由見該檔。
    access_log /var/log/nginx/access.log edms_no_query;

    # 安全性 headers（HSTS / CSP / X-Frame-Options 等，全站套用）
    include /etc/nginx/security-headers.conf;

    # ── 真實 client IP 還原 ────────────────────────────────────────────────
    # 鏈路：Cloudflare edge → cloudflared（bms-prod-01）→ front-proxy（bms-prod-02）
    #       → 本容器。front-proxy 原樣轉發 Cloudflare 掛保證、不可偽造的
    #       CF-Connecting-IP，故此處信任 proxy 所在的 docker 網段並讀該 header；
    #       不採信可被呼叫方偽造的 X-Forwarded-For。
    #
    # ⚠️ 此網段必須與 docker-compose.prod.yml 之 edms-proxy-net（external，以 ipam
    #    固定）一致。改了一邊而未改另一邊**不會有任何錯誤訊息**——服務照跑，但
    #    access log 的 client IP 會變成 proxy 位址，且 rate-limit.conf 的
    #    limit_req_zone 會把全站算成同一個來源。
    #    front-proxy 由 TBMS repo 管理，見其 edge/README.md。
    set_real_ip_from 172.28.241.0/24;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # Gzip 壓縮
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml+rss;
    gzip_min_length 1024;

    # 靜態資源長效快取（Vite build 產出的 hash 檔名）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # 本 location 有自己的 add_header，會遮蔽 server 層設定，須重新 include
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # ── 超過 body 上限時回結構化錯誤（#806）──────────────────────────────────
    # nginx 預設回 HTML 413，前端 `toApiError` 只能顯示「伺服器處理失敗（HTTP 413）」。
    # 改回 `{error_code, error_message}`，前端照一般業務錯誤顯示。訊息刻意不寫數字：
    # 三個 location 共用這一段，而上限各不相同（51m／501m／2m）。
    error_page 413 = @payload_too_large;
    location @payload_too_large {
        default_type application/json;
        return 413 '{"error_code":"COMMON_413","error_message":"上傳內容超過系統允許的大小上限"}';
    }

    # ── 上傳端點（#806）───────────────────────────────────────────────────
    # 只有這 5 支收檔案（multipart），其餘 API 的 body 上限見下方 `location /api/`：
    #   POST /api/dm/documents                              dm/editor/router.py create_document
    #   POST /api/dm/documents/{doc_id}/versions            dm/editor/router.py add_version
    #   PUT  /api/dm/documents/{doc_id}/versions/{ver_id}   dm/editor/router.py update_draft_version
    #   POST /api/dm/documents/{doc_id}/obsolete            dm/obsolete/router.py initiate_obsolete
    #   POST /api/et/materials/{material_id}/videos         et/material/router.py upload_material_video
    #
    # 🔴 **新增上傳端點時必須加進對應的 regex**，否則它落到 `location /api/` 的 2m 上限，
    #    超過 2MB 的檔案被 nginx 直接回 413。後端 `app/core/upload_auth_precheck.py` 的
    #    `UPLOAD_PATH_PATTERN` 也要同步加（#810）。兩邊都由
    #    `backend/tests/unit/test_core_upload_auth_precheck.py` 以 OpenAPI 的路由為準守門，漏列會紅。
    #    盤點方式：後端 router 參數含 `UploadFile` / `File(` / `Form(` 者，前端則是送 `FormData` 的呼叫。
    #
    # regex 也會命中同路徑的 GET（文件清單、版本清單），對它們無害：body 上限只在有 body
    # 時作用，`upload_conn` 只計入 multipart，415 閘門只擋 POST／PUT／PATCH（見 api-upload.conf）。
    #
    # ⚠️ 上傳上限須與 app 端自身的上限一致，**改動任一方時兩邊必須一起改**——只調 app 端
    #    參數的話，超過本值的請求連後端都到不了，那道檢查沒有機會執行（見 #304）。設定值
    #    要比 app 上限多一點：本指令量的是整個 multipart body（含 boundary 與 part header），
    #    app 端量的是裡面的檔案，設成剛好相等會讓「剛好等於上限的檔案」因信封超標而被擋。
    #
    #    🔴 本段原本斷言「此值為**實際生效的上限**，front-proxy 放行 620m，故瓶頸在這裡」
    #    ——**那句話沒有經過實機查證，且已被推翻**（#360）。2026-09-23 實測 4 MB body
    #    穿過整條 proxy 鏈（Cloudflare → cloudflared → front-proxy → 本容器）抵達 app。
    #    ⚠️ 該斷言真正的代價是**它讓人停止往下查**：#360 的四個假設全繞著 body size
    #    打轉，而真因是部署映像缺 ffmpeg，照那個方向查到底也找不到。

    # DM 文件與廢止附件：51m = DM_FILE_MAX_MB(50) + 信封餘裕。該參數與下方的 ET_VIDEO_MAX_SIZE_MB
    # 皆為 READONLY（DP02 不可調），實質固定。#806 之前與 ET 影片共用 501m，等於讓未登入者對 DM 也能送 10 倍的 body。
    location ~ ^/api/dm/documents(/[^/]+/(versions(/[^/]+)?|obsolete))?$ {
        client_max_body_size 51m;
        include /etc/nginx/api-upload.conf;
    }

    # ET 教材影片：501m = DP_PARAM.ET_VIDEO_MAX_SIZE_MB(500) + 信封餘裕。
    location ~ ^/api/et/materials/[^/]+/videos$ {
        client_max_body_size 501m;
        include /etc/nginx/api-upload.conf;
    }

    location /api/ {
        # 一般 API 的 body 上限（#806）。原本與上傳端點共用 501m，等於連未登入可呼叫的
        # `POST /api/login` 都收得下 501MB——而 FastAPI 先把 JSON body 整包讀進記憶體才跑
        # 身分驗證，後端又只有 1 個 worker，撐爆就是 DM 與 ET 全站停擺。
        # 2m 的取法：最大的單一 JSON 欄位是教材說明 HTML（`et/material/schemas.py` 的
        # `DESCRIPTION_HTML_MAX_LEN = 50_000` 字元，中文 UTF-8 約 150KB），清單類欄位也都有
        # 筆數上限，整包請求遠小於 2m；超過時 nginx 回 413、後端完全不讀。
        # 盤點方式：`grep -rnE "MAX_LEN.*[0-9_]{5,}|max_length=[0-9_]{5,}" backend/app`。
        #
        # ⚠️ `location /` 與 server 層都沒設，非 /api/ 的請求落在 nginx 預設的 1m。
        client_max_body_size 2m;
        # 請求 body 由 nginx 收完整再轉給後端（預設行為，此處不關閉）：慢速送出 body 的
        # 請求只佔 nginx，不佔後端。128k 以內留在記憶體（預設 16k 以上就寫進 client_temp），
        # 一般 JSON 不必每次落磁碟。
        client_body_buffer_size 128k;
        include /etc/nginx/api-proxy.conf;
    }

    # 後端健康檢查（含 DB 探活），供 CD 部署驗證使用。
    # ⚠️ 從容器內部打此端點時一律用 127.0.0.1，不可用 localhost——本容器以非 root
    #    執行，entrypoint 加不上 listen [::]:80，只監聽 IPv4。
    location = /health {
        proxy_pass http://edms-backend:8000/health;
        proxy_set_header Host edms-backend;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        access_log off;
    }

    # 前端 SPA（React Router fallback）
    location / {
        root /usr/share/nginx/html;

        # 入口 HTML 每次回源驗證（#441）。
        #
        # 🔴 **這條與上面靜態資源那條是一組，缺一不可。** 資產帶內容雜湊、設 immutable
        # 是對的；但入口 HTML 若沒有任何 Cache-Control，瀏覽器會改用**啟發式快取**自行
        # 決定存多久（一般取 Last-Modified 至今的一成）。兩者相加的後果是：index.html
        # 一旦陳舊，它指向的舊 bundle 會從本機快取秒載、整年不重抓——使用者跑的是一個
        # 完全舊版的前端，而且沒有任何跡象。
        #
        # ⚠️ 2026-09-29 手測 #428 時實際被咬：程式已合併、CD 已 build、VM 已部署、線上
        # bundle 抓下來 grep 得到新字串，但測試者的瀏覽器跑的是舊版；而舊版底下多數手測
        # 項目**看起來照樣通過**，回報長成「大部分都對，只有兩項怪怪的」。
        #
        # no-cache（而非 no-store）：仍可存於快取，但每次都得向伺服器驗證。命中時回
        # 304、不重傳 body，代價僅一次條件式請求。
        add_header Cache-Control "no-cache" always;
        # 本 location 有自己的 add_header，會遮蔽 server 層設定，須重新 include
        include /etc/nginx/security-headers.conf;

        try_files $uri $uri/ /index.html;
    }
}
