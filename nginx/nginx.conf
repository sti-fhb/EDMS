server {
    listen 80;
    server_name _;

    # Access log 不記 query string（全站套用）。格式定義於 http 層的
    # conf.d/00-log-format.conf，理由見該檔。
    access_log /var/log/nginx/access.log edms_no_query;

    # 安全性 headers（HSTS / CSP / X-Frame-Options 等，全站套用）
    include /etc/nginx/security-headers.conf;

    # ── 真實 client IP 還原 ────────────────────────────────────────────────
    # 鏈路：Cloudflare edge → cloudflared（bms-prod-01）→ front-proxy（bms-prod-02）
    #       → 本容器。front-proxy 原樣轉發 Cloudflare 掛保證、不可偽造的
    #       CF-Connecting-IP，故此處信任 proxy 所在的 docker 網段並讀該 header；
    #       不採信可被呼叫方偽造的 X-Forwarded-For。
    #
    # ⚠️ 此網段必須與 docker-compose.prod.yml 之 edms-proxy-net（external，以 ipam
    #    固定）一致。改了一邊而未改另一邊**不會有任何錯誤訊息**——服務照跑，但
    #    access log 的 client IP 會變成 proxy 位址，且 rate-limit.conf 的
    #    limit_req_zone 會把全站算成同一個來源。
    #    front-proxy 由 TBMS repo 管理，見其 edge/README.md。
    set_real_ip_from 172.28.241.0/24;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # Gzip 壓縮
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml+rss;
    gzip_min_length 1024;

    # 靜態資源長效快取（Vite build 產出的 hash 檔名）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # 本 location 有自己的 add_header，會遮蔽 server 層設定，須重新 include
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    location /api/ {
        # ⚠️ 上傳上限：EDMS 含 DM 受控文件與 ET 教材（可能有影音），此值為**實際生效
        #    的上限**——front-proxy 那層放行 620m，故瓶頸在這裡。須依實際需求調整，
        #    並與 app 端自身的上限一致，否則超量請求會由 nginx 自產 HTML 413 而非
        #    結構化錯誤碼。
        client_max_body_size 100m;
        limit_conn upload_conn 4;
        limit_req zone=api_limit burst=100 nodelay;

        proxy_pass http://edms-backend:8000;
        # 固定 Host 為後端服務名，不轉發可竄改的 Host 標頭
        proxy_set_header Host edms-backend;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 後端健康檢查（含 DB 探活），供 CD 部署驗證使用。
    # ⚠️ 從容器內部打此端點時一律用 127.0.0.1，不可用 localhost——本容器以非 root
    #    執行，entrypoint 加不上 listen [::]:80，只監聽 IPv4。
    location = /health {
        proxy_pass http://edms-backend:8000/health;
        proxy_set_header Host edms-backend;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        access_log off;
    }

    # 前端 SPA（React Router fallback）
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
