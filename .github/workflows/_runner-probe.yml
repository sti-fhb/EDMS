# 臨時探測用：確認本 repo 能否取得 [self-hosted, cd] runner。
# 只執行 hostname / echo，不觸碰任何服務。確認後即刪除。
name: Runner Probe (temporary)

on:
  pull_request:
    branches: [main]

jobs:
  probe:
    name: 探測 self-hosted cd runner
    runs-on: [self-hosted, cd]
    timeout-minutes: 2
    steps:
      - name: 回報執行主機
        run: |
          echo "runner hostname: $(hostname)"
          echo "RUNNER_NAME=${RUNNER_NAME:-unknown}"
          echo "probe ok"
