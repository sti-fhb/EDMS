# 依賴安全告警定期提醒
#
# 為什麼需要這個（見 #143）：
#   Dependabot 告警只出現在 GitHub 的 Security 頁面，沒人主動去點就等於不存在。
#   #139 那批前端告警從 2026-08-01 躺到 08-07 才被發現，而且是查另一張 PR 時撞見的。
#   主專案 TBMS 靠的是「有人固定會去看」，EDMS 已證實沒有這個習慣，故以機制補上。
#
# 設計原則：
#   1. **不阻擋任何 PR** —— 這是提醒不是 gate，與 ci.yml 完全獨立。之所以不做阻擋型
#      audit gate：pnpm audit 查的是 npm registry 的 advisory DB，不認得 GitHub 端的
#      dismiss 決定（#139 dismiss react-router 後 GitHub 歸零但 pnpm audit 仍報 1 high），
#      阻擋型 gate 會被這類已判定不適用的項目永久卡死。改讀 Dependabot alerts API 就沒
#      這個問題——它本來就認得 dismiss，只回報真正未處理的。
#   2. **維護單一追蹤 issue，不是每週開新的** —— 以固定標題辨識，有告警就建立/更新、
#      清空就關閉。
#   3. **只在告警集合改變時留言** —— body 裡以隱藏標記記錄上次的 alert 編號，相同就
#      靜默更新不通知，避免每週洗版導致通知被無視（那等於回到原點）。

name: Dependency Alerts

on:
  schedule:
    # 每週一 01:00 UTC ＝ 台北時間 09:00（週一上班時間看到）
    - cron: "0 1 * * 1"
  # 合併後可立即手動觸發驗證；workflow_dispatch 需 workflow 存在於預設分支才能使用，
  # 故此項無法在 PR 階段驗證（見 PR 說明）
  workflow_dispatch:

# 指定 permissions 區塊後，未列出的權限一律為 none。
#   security-events: read —— 讀 Dependabot alerts（見下方 GITHUB_TOKEN 的已知不確定性）
#   issues:          write —— 建立／更新／留言／關閉追蹤 issue
#   contents:        read  —— 本 job 不 checkout、不讀檔案，看似不需要；但 gh CLI 的
#                             issue 子命令走 GraphQL，需要先解析 repository node。此項
#                             為唯讀且本 repo 為 public，保留的代價為零，可避免把
#                             「Resource not accessible by integration」誤判成下方
#                             GITHUB_TOKEN 讀 alerts 的權限問題。
permissions:
  contents: read
  issues: write
  security-events: read

concurrency:
  group: dependency-alerts
  cancel-in-progress: false

jobs:
  report:
    name: 盤點未處理的 Dependabot 告警
    runs-on: ubuntu-latest
    steps:
      - name: 盤點並更新追蹤 issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TRACKER_TITLE: "[自動] 未處理的 Dependabot 安全告警"
        run: |
          set -euo pipefail

          # ── 1. 讀取未處理告警 ────────────────────────────────────────────
          # per_page=100 不分頁：本 repo 歷來告警總數為個位數，100 綽綽有餘。
          # 若真的達到 100 則於下方顯式警告，不靜默截斷。
          if ! gh api "repos/${REPO}/dependabot/alerts?state=open&per_page=100" > alerts.json 2> api-err.txt; then
            echo "::error::讀取 Dependabot alerts 失敗。"
            echo "::error::最可能的原因是 GITHUB_TOKEN 無權讀取 Dependabot alerts——官方文件僅載明 PAT 需 security_events scope，未載明 GITHUB_TOKEN 是否支援，且 /dependabot/alerts 回 403 是長年被回報的行為。"
            echo "::error::若確認為權限問題，改用 fine-grained PAT：Repository access 限定本 repo、Permissions 只給「Dependabot alerts: Read-only」、設短到期日、存為 repo secret（勿存 org secret）。"
            echo "::error::不要用 classic PAT 的 security_events scope——那是跨全帳號所有 repo 的讀+寫。"
            echo "::error::另一條 fallback（pnpm audit + 到期日 ignore 清單）只涵蓋 frontend，會漏掉 backend 的 pip 告警，需另配 pip-audit。"
            cat api-err.txt
            exit 1
          fi

          COUNT=$(jq 'length' alerts.json)
          echo "未處理告警數：${COUNT}"
          if [ "${COUNT}" -ge 100 ]; then
            echo "::warning::告警數達 100（未分頁上限），清單可能不完整，請改用分頁查詢。"
          fi

          # ── 2. 找出既有的追蹤 issue ──────────────────────────────────────
          # 以完整標題比對而非 --search：搜尋索引有延遲，剛建立的 issue 可能查不到，
          # 那會導致重複建立追蹤 issue。逐筆比對是確定性的。
          # 標題透過 jq 的 env 取用，不做字串插值（標題含中文與方括號）。
          # limit 取 500 遠高於實際需求（本 repo 目前 13 個 open issue）；若真的抵達
          # 上限則顯式警告，不靜默截斷——否則追蹤 issue 落在 500 筆之外時會被誤判為
          # 不存在而重複建立，違反「維護單一追蹤 issue」的設計承諾。
          ISSUE_SCAN_LIMIT=500
          if ! gh issue list --repo "${REPO}" --state open --limit "${ISSUE_SCAN_LIMIT}" \
                 --json number,title,author > issues.json 2> issue-err.txt; then
            echo "::error::讀取 issue 清單失敗（可能為權限不足或 API rate limit）。"
            cat issue-err.txt
            exit 1
          fi

          if [ "$(jq 'length' issues.json)" -ge "${ISSUE_SCAN_LIMIT}" ]; then
            echo "::warning::open issue 數已達掃描上限 ${ISSUE_SCAN_LIMIT}，追蹤 issue 可能未被掃到而重複建立，請調高 ISSUE_SCAN_LIMIT。"
          fi

          # ⚠️ 必須同時比對「作者為 bot」——本 repo 是 PUBLIC 且 issues 開放，只比對標題
          # 的話，任何 GitHub 使用者都能開一張同名 issue 來劫持本機制：gh issue list 預設
          # created desc，`first` 會取到最新的那張（攻擊者的），於是每週的更新／留言／關閉
          # 全部打在誘餌上，真正的追蹤 issue 永遠不會被建立。更糟的是誘餌 body 可預先塞入
          # 一個假的 fingerprint 標記，讓流程判定「集合未變」而完全不留言——靜音且不留失敗
          # 訊號，正好抵銷本機制的目的。
          TRACKER=$(TRACKER_TITLE="${TRACKER_TITLE}" jq -r \
            '[.[] | select(.title == env.TRACKER_TITLE and .author.is_bot == true)]
             | first | .number // empty' issues.json)

          # ── 3. 告警已清空 → 關閉追蹤 issue ───────────────────────────────
          if [ "${COUNT}" -eq 0 ]; then
            if [ -n "${TRACKER}" ]; then
              gh issue comment "${TRACKER}" --repo "${REPO}" \
                --body "未處理的 Dependabot 告警已清空（本次盤點 0 筆），自動關閉。若日後再出現告警會重新開立追蹤 issue。"
              gh issue close "${TRACKER}" --repo "${REPO}" --reason completed
              echo "✅ 告警已清空，已關閉追蹤 issue #${TRACKER}"
            else
              echo "✅ 無未處理告警，且無待關閉的追蹤 issue"
            fi
            exit 0
          fi

          # ── 4. 組出 issue body（含供比對用的隱藏標記）────────────────────
          #
          # ⚠️ 刻意只寫「數量與嚴重度分佈」，不寫套件名、GHSA、修補版等明細。
          # 本 repo 是 PUBLIC，而 Dependabot alerts API 之所以限定 write/admin 才能讀，
          # 正是因為「尚未修補的漏洞清單」屬敏感資訊。把明細寫進 public issue 等於主動
          # 公告「這幾個洞我們知道但還沒補」。
          # 邊際風險確實有限（lockfile 本來就公開，任何人都能自行掃描），但那是「別人要
          # 花力氣推導」與「我們主動整理好貼出來」的差別，且外洩的增量是「維護者已知悉
          # 卻尚未處理」這個狀態訊號——這應該是明示的決定，不該是預設值。
          # 明細一鍵可達（Security 分頁），權限邊界由 GitHub 自己把關。
          # 若日後本 repo 轉為 private，可考慮把明細表加回來以提高可操作性。
          FINGERPRINT=$(jq -r '[.[].number] | sort | map(tostring) | join(",")' alerts.json)
          SEVERITY_BREAKDOWN=$(jq -r '
            group_by(.security_advisory.severity)
            | map({s: .[0].security_advisory.severity, n: length})
            | sort_by(.s | if . == "critical" then 0 elif . == "high" then 1
                           elif . == "medium" then 2 else 3 end)
            | map("\(.s) \(.n)") | join("、")
          ' alerts.json)

          {
            echo "<!-- dependency-alerts-fingerprint: ${FINGERPRINT} -->"
            echo
            echo "> 由 \`.github/workflows/dependency-alerts.yml\` 自動維護。**這是提醒，不阻擋任何 PR。**"
            echo "> 處理完後不需手動關閉——下次盤點發現已清空會自動關閉本 issue。"
            echo
            echo "## 目前有 ${COUNT} 筆未處理的 Dependabot 告警"
            echo
            echo "嚴重度分佈：**${SEVERITY_BREAKDOWN}**"
            echo
            echo "👉 **明細請見 [Security → Dependabot alerts](https://github.com/${REPO}/security/dependabot?q=is%3Aopen)**"
            echo
            echo "> 本 repo 為 public，故此處刻意不列出套件名與 advisory 編號——未修補的漏洞清單屬敏感資訊，明細留在 Security 分頁由 GitHub 的權限邊界把關。"
            echo
            echo "## 處理方式"
            echo
            echo "1. 能升就升：\`pnpm update <pkg> --depth Infinity\`（前端）／\`uv lock --upgrade-package <pkg>\`（後端）"
            echo "2. 升完在 \`frontend/package.json\` 的 \`pnpm.overrides\` 補上版本下限，避免日後被較低約束拉回（見 #143）"
            echo "3. 判定不適用者，在 GitHub 上 dismiss 並寫明依據與**重評觸發條件**"
            echo
            echo "> ⚠️ Dependabot 的 dismiss 綁在 alert 實例上，重掃時 alert 可能被汰換重建、dismiss 不繼承（#139 的 alert #1 → #11 即為實例）。看到已判定不適用的告警又出現時，先確認是不是同一個 GHSA 被重建。"
          } > body.md

          # ── 5. 建立或更新追蹤 issue ─────────────────────────────────────
          if [ -z "${TRACKER}" ]; then
            URL=$(gh issue create --repo "${REPO}" --title "${TRACKER_TITLE}" --body-file body.md)
            echo "🆕 已建立追蹤 issue：${URL}"
            exit 0
          fi

          # 既有 issue：比對指紋，相同則靜默更新（不留言，避免每週洗版）
          #
          # sed 用 `0,/pattern/` 位址範圍讓它自己只印一次，不接 `| head -1`——後者在 body
          # 含兩個以上標記時會讓 sed 收到 SIGPIPE 回傳 141，pipefail 下整個 job 掛掉。
          # cut 截斷至 500 字元：PREV 會被插進下方的 comment，而 issue comment 上限 65536
          # 字元；標記內容雖非 shell 求值（雙引號內的變數展開不會二次求值，無 command
          # injection），但過長字串會讓 gh issue comment 失敗、每週固定紅燈。
          PREV=$(gh issue view "${TRACKER}" --repo "${REPO}" --json body --jq '.body' \
            | sed -n '0,/<!-- dependency-alerts-fingerprint: /{s/.*<!-- dependency-alerts-fingerprint: \([^>]*\) -->.*/\1/p}' \
            | cut -c1-500)

          gh issue edit "${TRACKER}" --repo "${REPO}" --body-file body.md

          if [ "${PREV}" = "${FINGERPRINT}" ]; then
            echo "ℹ️ 告警集合未變（${FINGERPRINT}），已靜默更新 #${TRACKER}，不留言"
          else
            gh issue comment "${TRACKER}" --repo "${REPO}" \
              --body "告警集合有變動（前次：\`${PREV:-無}\` → 本次：\`${FINGERPRINT}\`），已更新上方清單。"
            echo "🔔 告警集合已變動，已留言通知 #${TRACKER}"
          fi
