# ============================================================
# EDMS CI Pipeline
#
# Runner：GitHub-hosted（ubuntu-latest）
#   測試所需的 PostgreSQL 以 service container 啟動（見 backend job），
#   不依賴任何自架 runner 或內網資源。
#   本機開發請用 `pnpm ci:local`（scripts/local-ci.sh），檢查項與本檔一致。
#
# Branch ruleset 只需把 "all-checks" 設為 main 的 required status check，
#   即可讓「CI 綠燈才能 merge」生效。
#
# 觸發：PR 開啟 / 更新（目標 main，draft PR 除外）
# 路徑過濾（dorny/paths-filter）：只改 .md / docs/ 時跳過 lint/test，
#   all-checks 仍回報成功、不卡 merge。
#
# 工作流程：
#   changes ─┬─ backend  (uv.lock 一致性 + ruff + alembic heads + unit/integration tests)
#            └─ frontend (ESLint + type-check + tests；frontend/ 建立後才觸發)
#                                                          └─► all-checks
#
# 註：E2E job 待 ET/DM 有 UI + e2e/ 目錄後再補（見 #57）。
# ============================================================

name: CI

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# 同一個 PR 若有新 push，取消舊的執行以節省資源
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────
  # 路徑偵測：判斷哪些目錄有變更，決定要跑哪些 job
  # 只改 .md / docs/ 等非程式碼時，backend/frontend 皆為 false
  # ──────────────────────────────────────────────────────────
  changes:
    name: Detect Changes
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout 原始碼
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 偵測變更路徑
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              # 🔴 本檔自己也要列入，否則「只改 ci.yml」的 PR 會讓 backend job **skip**
              # 而 all-checks 照樣綠——等於把改過的檢查流程在從未執行的狀態下合併進 main。
              # #541 加 uv.lock 一致性檢查時就是這個情形：若不加這行，那道新守門在它自己的
              # PR 上一次都不會跑。代價是日後改 ci.yml 都會跑完整 backend job（數分鐘），
              # 相對於「合併一道沒驗過的檢查」這是划算的。
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              # 同上，理由對稱：改到本檔的前端區塊時，若不讓 frontend job 跑起來，
              # 一樣是「把改過的檢查在從未執行的狀態下合併」。
              # ⚠️ 代價比後端大一些——前端測試是已知會因機器負載出現假紅的那一批
              # （見 `.claude/rules/sti-testing.md`「前端『假紅』判定」）。若日後覺得
              # 改 ci.yml 時頻繁撞到前端假紅，這一行是第一個可以拿掉的，但拿掉前請明白
              # 換回來的是什麼。
              - '.github/workflows/ci.yml'

  # ──────────────────────────────────────────────────────────
  # 後端：Lint + Tests（單一 job，依賴只安裝一次）
  #
  # 步驟順序刻意把 lint / format / Alembic heads 排在測試之前：
  #   不需要 DB、速度最快，能在跑完整測試前先攔下格式與 migration 問題。
  # Integration tests 需要真實 PostgreSQL；diff-cover 只檢查本次 PR 新增/修改的行。
  # ──────────────────────────────────────────────────────────
  backend:
    name: Backend Lint & Tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # 啟動 PostgreSQL 17 service container（ubuntu-latest 預裝 Docker）
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: edms
          POSTGRES_PASSWORD: edms
          POSTGRES_DB: test_edms
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # fetch-depth: 0 取得完整歷史，確保 diff-cover 能正確計算 merge-base
      - name: Checkout 原始碼
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: 安裝 uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      # 🔴 必須排在 `uv sync` **之前**：`uv sync`（未帶 `--locked`）在偵測到 lock 與
      # pyproject 不一致時會**自行重新解析並改寫 lock**，於是「改了 pyproject 卻忘了跑
      # uv lock」在 CI 上恆綠——CI 幫你補了那一步，然後把改寫過的 lock 隨 runner 丟掉。
      #
      # 而正式映像用的是 `uv sync --frozen`（`backend/Dockerfile:33`），`--frozen` 的語意是
      # 「不檢查、直接照 lock 裝」⇒ 會照著那份**過期的 lock** 安裝，新增的相依靜默缺席。
      # 兩端對「lock 過期」的處理方向相反，而且都不出聲（#541）。
      #
      # 寫成獨立步驟而非 `uv sync --locked`：失敗時 CI 畫面上顯示的是**步驟名稱**。
      # 走 `--locked` 的話失敗步驟叫「安裝 Python 依賴」，讀的人會先以為是安裝壞了。
      #
      # ⛔ **這是「一致性」檢查，不是「完整性」檢查——別把它當供應鏈守門。** 實測（#541）：
      # 把 uv.lock 裡某套件的 sha256 改成全 0、或把 wheel URL 指向 evil.example.com，
      # `uv lock --check` 一律 **exit 0 通過**；降版同理。原因是重解析會優先沿用既有 pin，
      # 只要仍滿足 pyproject 的約束（本專案幾乎全是 `>=` 下界）就自洽。
      #   - hash 比對發生在**安裝階段**（`uv sync` 會驗 lock 內的 sha256）
      #   - 來源與降版只能靠**人工 review `uv.lock` 的 diff**
      - name: 檢查 uv.lock 與 pyproject.toml 一致（改了相依必須重跑 uv lock）
        run: uv lock --check

      - name: 安裝 Python 依賴（含 dev 套件）
        run: uv sync --dev

      # ET 教材影片以 ffprobe 解析長度（#203 / SA 裁示 Q2）——本專案唯一的系統層依賴。
      # 寫成「有就跳過、沒有才裝」而非無條件 apt install：runner 映像檔是否預裝 ffmpeg
      # 會隨版本變動，寫死任一邊都會在對方成立時錯（多花 10 秒，或整批影片測試紅燈）。
      # 印出版本讓 log 直接回答「這個 runner 到底有沒有」。
      - name: 確保 ffmpeg 可用（ET 影片時長解析）
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            echo "runner 未預裝 ffmpeg，開始安裝"
            sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          else
            echo "runner 已預裝 ffmpeg"
          fi
          ffprobe -version | head -1

      # ── Lint（不需 DB，最快，提前 fail-fast）──
      - name: 執行 ruff lint
        run: uv run ruff check .

      - name: 執行 ruff format 檢查
        run: uv run ruff format --check .

      - name: 檢查 Alembic heads（多 head 時提前阻擋）
        run: |
          HEAD_COUNT=$(uv run alembic heads | wc -l)
          if [ "$HEAD_COUNT" -gt 1 ]; then
            echo "::error::發現 ${HEAD_COUNT} 個 Alembic head，請先合併後再提交 PR"
            uv run alembic heads
            exit 1
          fi
          echo "✅ Alembic head 正常（單一 head 或尚無 migration）"

      # ── Tests（unit + integration，含覆蓋率）──
      # EDMS 認證用簡單 JWT；Email 不加密（無 ENCRYPTION_KEY）、無全域 RBAC（無 ADMIN_ROLE）
      - name: 執行 Alembic migration
        env:
          DATABASE_URL: postgresql+asyncpg://edms:edms@localhost:5432/test_edms
          JWT_SECRET_KEY: ci-test-secret-key-at-least-32-bytes-long
          # CI 屬非 production；設 true 以免 FRONTEND_BASE_URL prod 護欄擋下 settings 載入
          # （alembic 不經 conftest，需在此顯式注入）
          DEBUG: "true"
          # 測試 DB 不種示範帳號（migration 7b24b5dea3ad）——那 5 個帳號會混進
          # 「列全部使用者 / 全部管理者 / DM_VIEWER 母體」等斷言的預期值。
          # tests/integration/conftest.py 重建 schema 時亦注入同一變數。
          SEED_DEMO_ACCOUNTS: "false"
        run: uv run alembic upgrade head

      # -n auto：pytest-xdist 依核心數並行跑（integration 為 I/O-bound）
      - name: 執行所有測試（含覆蓋率）
        env:
          DATABASE_URL: postgresql+asyncpg://edms:edms@localhost:5432/test_edms
          JWT_SECRET_KEY: ci-test-secret-key-at-least-32-bytes-long
          # 同上；conftest 亦有 setdefault("DEBUG","true") 兜底，此處顯式對齊 migration 步驟
          DEBUG: "true"
        run: uv run pytest -v -n auto --cov --cov-report=xml --cov-report=term-missing

      # 只檢查本次 PR 新增/修改的行是否達 80% 覆蓋率；整體覆蓋率不設門檻
      - name: 執行 diff-cover（僅檢查本次 PR 變更的行）
        if: github.event_name == 'pull_request'
        run: uv run diff-cover coverage.xml --compare-branch=origin/main --fail-under=80

  # ──────────────────────────────────────────────────────────
  # 前端：ESLint + type-check + Tests
  # frontend/ 建立後（T010）才會被 paths-filter 觸發；在此之前恆 skip。
  # ──────────────────────────────────────────────────────────
  frontend:
    name: Frontend Lint, Type Check & Tests
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout 原始碼
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 安裝 pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0

      - name: 安裝 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22

      - name: 安裝前端依賴
        run: pnpm install --frozen-lockfile

      - name: 執行 ESLint
        run: pnpm lint

      - name: 執行 TypeScript 型別檢查
        run: pnpm type-check

      - name: 執行前端測試
        run: pnpm test

  # ──────────────────────────────────────────────────────────
  # 彙總：所有 job 通過才算 CI 綠燈
  # Branch ruleset 只需設定 "all-checks" 這一個 status check（runner 上線後才設）。
  # 被 skip 的 job（路徑過濾）result 為 "skipped"，不算 failure。
  # ──────────────────────────────────────────────────────────
  all-checks:
    name: all-checks
    runs-on: ubuntu-latest
    needs:
      - changes
      - backend
      - frontend
    if: always()

    steps:
      - name: 確認所有 job 皆成功
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more jobs failed. Check the logs above."
            exit 1
          elif [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more jobs were cancelled."
            exit 1
          else
            echo "All checks passed (skipped jobs are OK)."
          fi
